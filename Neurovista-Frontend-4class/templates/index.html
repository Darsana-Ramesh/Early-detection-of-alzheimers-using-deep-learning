<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroVista | AD Multi-Modal GNN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #2c3e50; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #3498db; border: none; }
        #loading { display: none; }
        .heatmap-img { width: 100%; border-radius: 8px; border: 1px solid #ddd; }
        .prediction-box { border-left: 5px solid #3498db; padding: 15px; background: #e8f4fd; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">NeuroVista: 4-Class AD Prediction (GNN)</span>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-4">
            <div class="card p-4">
                <h5 class="card-title">Subject Analysis</h5>
                <p class="text-muted small">Upload fMRI Time-Series (.npy) or NIfTI (.nii)</p>
                <form id="uploadForm">
                    <div class="mb-3">
                        <input class="form-control" type="file" id="fmriFile" accept=".npy,.nii,.gz">
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="submitBtn">Analyze Scan</button>
                </form>

                <div id="loading" class="text-center mt-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Computing Triple-Topology Graphs...<br><span class="small">(Static, Directed, Spectral)</span></p>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div id="resultArea" style="display: none;">
                <div class="card p-4 mb-4">
                    <div class="prediction-box">
                        <h3>Diagnosis: <span id="labelText" class="text-primary">---</span></h3>
                        <h5>Confidence: <span id="confText">0%</span></h5>
                    </div>
                    
                    <div class="mt-3">
                        <h6>Probability Breakdown:</h6>
                        <div class="progress mt-2" style="height: 25px;" id="probBars">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-4">
                        <p class="text-center fw-bold small">Pearson (Static)</p>
                        <img id="imgPearson" class="heatmap-img">
                    </div>
                    <div class="col-4">
                        <p class="text-center fw-bold small">Granger (Directed)</p>
                        <img id="imgGranger" class="heatmap-img">
                    </div>
                    <div class="col-4">
                        <p class="text-center fw-bold small">Coherence (Spectral)</p>
                        <img id="imgWavelet" class="heatmap-img">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('uploadForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const fileInput = document.getElementById('fmriFile');
        if (fileInput.files.length === 0) return alert("Select a file");

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        // UI State
        document.getElementById('loading').style.display = 'block';
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('resultArea').style.display = 'none';

        try {
            const response = await fetch('/predict', { method: 'POST', body: formData });
            
            // Check if response is okay
            if (!response.ok) {
                const errorBody = await response.json();
                throw new Error(errorBody.error || "Server Error");
            }

            const data = await response.json();

            // Update Labels
            document.getElementById('labelText').innerText = data.prediction;
            document.getElementById('confText').innerText = data.confidence;

            // Update Images
            document.getElementById('imgPearson').src = "data:image/png;base64," + data.heatmaps.pearson;
            document.getElementById('imgGranger').src = "data:image/png;base64," + data.heatmaps.granger;
            document.getElementById('imgWavelet').src = "data:image/png;base64," + data.heatmaps.wavelet;

            // Update Prob Bars
            let barHtml = "";
            const colors = ['#e74c3c', '#f39c12', '#f1c40f', '#2ecc71']; // AD, LMCI, EMCI, CN
            Object.keys(data.all_probs).forEach((key, index) => {
                const val = data.all_probs[key];
                barHtml += `<div class="progress-bar" role="progressbar" style="width: ${val}; background-color: ${colors[index]}" title="${key}: ${val}">${key}</div>`;
            });
            document.getElementById('probBars').innerHTML = barHtml;

            document.getElementById('resultArea').style.display = 'block';
        } catch (err) {
            alert("Analysis Error: " + err.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('submitBtn').disabled = false;
        }
    };
</script>

</body>
</html>
